name: Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  dast:
    uses: ./.github/workflows/dast.yml

  php_security:
    uses: ./.github/workflows/php-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
