version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      dependencies:
        patterns: ['*']
    # eslint-plugin-import (and eslint-plugin-react) peer-depend on eslint <=9,
    # so a v10 bump breaks `npm ci`. Lift once those plugins support v10.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  # One grouped PR per month keeps CI runs (and review noise) to a minimum.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  # The Dockerfile pins its base images by digest; this moves the pins.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ['*']
